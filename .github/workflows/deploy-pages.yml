name: Build PEP503 Index and Deploy Pages

on:
  push:
    tags:
      - "*.*.*"
  workflow_dispatch:
    inputs:
      git_ref:
        description: "Branch, Tag, or Commit SHA to checkout"
        required: false
        default: "main"
        type: string
      reason:
        description: "Reason for manual run"
        required: false
        default: "Manual trigger for testing"
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install tools
        run: |
          sudo apt-get update && sudo apt-get install -y pandoc
          pip install --upgrade pip
          pip install build hatchling pdoc3

      # ---------------------------------------------------------
      # 1. Build all packages
      # ---------------------------------------------------------
      - name: Build tofurengo
        run: python -m build
        working-directory: tofurengo

      - name: Build tofurengo-data-mj-v6-02-201
        run: python -m build
        working-directory: glyph/mj_v6_02_201

      - name: Build tofurengo-data-mj-v6-02-201-onka
        run: python -m build
        working-directory: glyph/mj_v6_02_201_onka

      - name: Build tofurengo-data-mj-plus-v4-10
        run: python -m build
        working-directory: glyph/mj_plus_v4_10

      - name: Build tofurengo-data-mj-plusx-v1-20
        run: python -m build
        working-directory: glyph/mj_plusx_v1_20

      # ---------------------------------------------------------
      # 2. Collect wheels
      # ---------------------------------------------------------
      - name: Collect wheels
        run: |
          mkdir -p docs/wheels
          cp tofurengo/dist/*.whl docs/wheels/
          cp glyph/mj_v6_02_201/dist/*.whl docs/wheels/
          cp glyph/mj_v6_02_201_onka/dist/*.whl docs/wheels/
          cp glyph/mj_plus_v4_10/dist/*.whl docs/wheels/
          cp glyph/mj_plusx_v1_20/dist/*.whl docs/wheels/

      # ---------------------------------------------------------
      # 3. Generate PEP503 index (Package names with hyphens)
      # ---------------------------------------------------------
      - name: Create PEP503 index
        run: |
          mkdir -p docs/simple

          for whl in docs/wheels/*.whl; do
            [ -e "$whl" ] || continue
            fname=$(basename "$whl")

            pkg_raw=$(echo "$fname" | cut -d'-' -f1)
            pkg_norm=$(echo "$pkg_raw" | tr '_' '-')

            mkdir -p docs/simple/$pkg_norm

            {
              echo '<!DOCTYPE html>'
              echo '<html>'
              echo '  <body>'
              echo "    <a href=\"../../wheels/$fname\">$fname</a>"
              echo '  </body>'
              echo '</html>'
            } > docs/simple/$pkg_norm/index.html
          done

      # ---------------------------------------------------------
      # 4. Extract pdoc3 CSS and Convert Markdown Pages
      # ---------------------------------------------------------
      - name: Create docs directory and Extract pdoc3 CSS
        run: |
          mkdir -p docs

          python -c "
          import pdoc.cli

          template = pdoc.tpl_lookup.get_template('css.mako')
          css = template.render()

          with open('docs/pdoc.css', 'w', encoding='utf-8') as f:
              f.write(css)
              f.write('''
              /* Layout fixes for Pandoc generated markdown */
              body {
                  padding: 2em;
                  max-width: 1200px;
                  margin: 0 auto;
              }
              #content {
                  max-width: 100% !important;
              }
              ''')
          "

      - name: Convert Markdown files to HTML with pdoc3 style
        run: |
          # ./README.md -> docs/index.html
          pandoc README.md \
            -s \
            -c pdoc.css \
            -o docs/index.html \
            --metadata title="Home"

          # ./GLYPH-TAG-SPECS.ja.md -> docs/specification.ja.html
          pandoc GLYPH-TAG-SPECS.ja.md \
            -s \
            -c pdoc.css \
            -o docs/specification.ja.html \
            --metadata title="Glyph Tag Specification (Japanese)"

      # ---------------------------------------------------------
      # 5. Copy pre-generated pdoc HTML files to docs/api
      # ---------------------------------------------------------
      - name: Copy tofurengo docs to docs/api
        run: |
          mkdir -p docs/api
          cp -r tofurengo/docs/tofurengo/* docs/api/

      # ---------------------------------------------------------
      # 6. Deploy to GitHub Pages
      # ---------------------------------------------------------
      - name: Check GitHub Pages status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages")

          if [ "$STATUS_CODE" -ne 200 ]; then
            echo "[ERROR] GitHub Pages is not enabled. Go to Settings > Pages and set Source to 'GitHub Actions'."
            exit 1
          fi

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

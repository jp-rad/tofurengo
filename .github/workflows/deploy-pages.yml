name: Build PEP503 Index and Deploy Pages

on:
  push:
    tags:
      - "*.*.*"
  workflow_dispatch:
    inputs:
      git_ref:
        description: "Branch, Tag, or Commit SHA to checkout"
        required: false
        default: "main"
        type: string
      reason:
        description: "Reason for manual run"
        required: false
        default: "Manual trigger for testing"
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.git_ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install tools
        run: |
          pip install --upgrade pip
          pip install build hatchling markdown

      # ---------------------------------------------------------
      # 1. Build all packages
      # ---------------------------------------------------------
      - name: Build tofurengo
        run: python -m build
        working-directory: tofurengo

      - name: Build tofurengo-data-mj-v6-02-201
        run: python -m build
        working-directory: glyph/mj_v6_02_201

      - name: Build tofurengo-data-mj-v6-02-201-onka
        run: python -m build
        working-directory: glyph/mj_v6_02_201_onka

      - name: Build tofurengo-data-mj-plus-v4-10
        run: python -m build
        working-directory: glyph/mj_plus_v4_10

      - name: Build tofurengo-data-mj-plusx-v1-20
        run: python -m build
        working-directory: glyph/mj_plusx_v1_20

      # ---------------------------------------------------------
      # 2. Collect wheels
      # ---------------------------------------------------------
      - name: Collect wheels
        run: |
          mkdir -p docs/wheels
          cp tofurengo/dist/*.whl docs/wheels/
          cp glyph/mj_v6_02_201/dist/*.whl docs/wheels/
          cp glyph/mj_v6_02_201_onka/dist/*.whl docs/wheels/
          cp glyph/mj_plus_v4_10/dist/*.whl docs/wheels/
          cp glyph/mj_plusx_v1_20/dist/*.whl docs/wheels/

      # ---------------------------------------------------------
      # 3. Generate PEP503 index (Package names with hyphens)
      # ---------------------------------------------------------
      - name: Create PEP503 index
        run: |
          mkdir -p docs/simple

          # Initialize root simple index
          echo '<!DOCTYPE html><html><body>' > docs/simple/index.html

          for whl in docs/wheels/*.whl; do
            [ -e "$whl" ] || continue
            fname=$(basename "$whl")

            pkg_raw=$(echo "$fname" | cut -d'-' -f1)
            pkg_norm=$(echo "$pkg_raw" | tr '_' '-')

            mkdir -p docs/simple/$pkg_norm

            # Package detail index
            {
              echo '<!DOCTYPE html>'
              echo '<html>'
              echo '  <body>'
              echo "    <a href=\"../../wheels/$fname\">$fname</a>"
              echo '  </body>'
              echo '</html>'
            } > docs/simple/$pkg_norm/index.html

            # Append to root simple index
            echo "    <a href=\"$pkg_norm/\">$pkg_norm</a><br/>" >> docs/simple/index.html
          done

          echo '  </body></html>' >> docs/simple/index.html

      # ---------------------------------------------------------
      # 4. Convert GLYPH-TAG-SPECS.ja.md to GitHub Styled HTML
      # ---------------------------------------------------------
      - name: Convert Specification Markdown to HTML
        run: |
          mkdir -p docs

          # Convert Markdown to HTML body with markdown extensions enabled (tables, code syntax highlighting)
          python -m markdown -x extra -x codehilite GLYPH-TAG-SPECS.ja.md > docs/spec_body.html

          # Assemble HTML file using GitHub default CSS template (github-markdown-css)
          cat << 'EOF' > docs/specification.ja.html
          <!DOCTYPE html>
          <html lang="ja">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Glyph Tag Specification (Japanese)</title>
            <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.9.0/github-markdown.min.css">
            <style>
              .markdown-body {
                box-sizing: border-box;
                min-width: 200px;
                max-width: 980px;
                margin: 0 auto;
                padding: 45px;
              }
              @media (max-width: 767px) {
                .markdown-body {
                  padding: 15px;
                }
              }
            </style>
          </head>
          <body class="markdown-body">
          EOF

          cat docs/spec_body.html >> docs/specification.ja.html
          echo '</body></html>' >> docs/specification.ja.html

          # Clean up temporary body file
          rm docs/spec_body.html

      # ---------------------------------------------------------
      # 5. Copy pre-generated pdoc HTML files directly to docs/
      # ---------------------------------------------------------
      - name: Copy tofurengo docs directly to docs/
        run: |
          mkdir -p docs
          cp -r docs/tofurengo/* docs/

      # ---------------------------------------------------------
      # 6. Deploy to GitHub Pages
      # ---------------------------------------------------------
      - name: Check GitHub Pages status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages")

          if [ "$STATUS_CODE" -ne 200 ]; then
            echo "[ERROR] GitHub Pages is not enabled. Go to Settings > Pages and set Source to 'GitHub Actions'."
            exit 1
          fi

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: 'docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
